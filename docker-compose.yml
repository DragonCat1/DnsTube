services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dnstube
      POSTGRES_PASSWORD: dnstube
      POSTGRES_DB: dnstube
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dnstube -d dnstube']
      interval: 3s
      timeout: 5s
      retries: 10

  dnstube:
    build: .
    ports:
      - '8080:8080'
      - '5353:5353/udp'
    environment:
      DATABASE_URL: postgres://dnstube:dnstube@postgres:5432/dnstube?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HTTP_ADDR: ':8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
